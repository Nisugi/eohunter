name: strict movement native contract

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  native-guard:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pin lich-5 #1575, independently of the optional coordination library
      # inherited through Hunter #111. No installed local build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: elanthia-online/lich-5
          ref: e4a55e1cd906e843b10811a625dc9ab0d2364cf8
          path: .guard-lich
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rspec spec/eohunter/strict_group_native_guard_spec.rb spec/eohunter/group_trial_spec.rb spec/eohunter/engine_spec.rb
        env:
          LICH_EXECUTION_GUARD_ROOT: ${{ github.workspace }}/.guard-lich
