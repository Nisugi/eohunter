name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rspec
      - run: bundle exec rubocop

  coordination-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rspec spec/eocoordination
      - run: bundle exec rake build
      - run: bundle exec ruby -c dist/libeocoordination.lic

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      # Each part on its own first: a syntax error in one of them is
      # otherwise only visible through the concatenated file, where the
      # reported line number belongs to the build output rather than to
      # the file a contributor edited.
      - run: ruby -c scripts/eohunter.lic
      - run: for f in scripts/eohunter/*.rb; do ruby -c "$f" > /dev/null || exit 1; done
      - run: ruby -c scripts/libeocoordination.lic
      - run: for f in scripts/eocoordination/*.rb; do ruby -c "$f" > /dev/null || exit 1; done
      - run: bundle exec rake build
      - run: ruby -c dist/eohunter.lic
      - run: ruby -c dist/libeocoordination.lic
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eohunter-scripts
          path: |
            dist/eohunter.lic
            dist/eohunter.lic.map
            dist/libeocoordination.lic
            dist/libeocoordination.lic.map
          if-no-files-found: error
