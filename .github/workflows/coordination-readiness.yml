name: coordination readiness contract

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  paired-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rspec spec/eohunter/coordination_spec.rb spec/eohunter/coordination_integration_spec.rb
        env:
          # The library ships from this repository since #115.
          EO_COORDINATION_ROOT: ${{ github.workspace }}/scripts
